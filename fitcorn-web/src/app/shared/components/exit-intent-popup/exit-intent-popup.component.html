<div *ngIf="isVisible()" 
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-all duration-300 font-sans">
  
  <!-- Centered Popup Card -->
  <div [ngClass]="themeService.theme() === 'dark' ? 'bg-charcoal-800 border-charcoal-700 text-white' : 'bg-white border-charcoal-100 text-charcoal-800'" 
       class="relative max-w-md w-full rounded-2xl p-8 shadow-2xl border transition-all duration-500 transform scale-100 overflow-hidden">
    
    <!-- Premium Accent Glow Bubble in Background -->
    <div class="absolute -top-12 -right-12 w-32 h-32 rounded-full bg-corn-400/25 blur-2xl pointer-events-none"></div>

    <!-- Close Button -->
    <button (click)="closePopup()" 
            class="absolute top-4 right-4 p-2 rounded-full hover:bg-charcoal-100 dark:hover:bg-charcoal-700 text-charcoal-400 hover:text-charcoal-600 dark:hover:text-white transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Marketing Content -->
    <div class="text-center space-y-6">
      
      <!-- Popcorn Icon Badge -->
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-corn-100 dark:bg-corn-400/10 text-corn-500 text-3xl animate-bounce">
        🍿
      </div>

      <div class="space-y-2">
        <h3 class="text-2xl font-display font-extrabold tracking-tight">Wait! Don't leave empty-handed</h3>
        <p class="text-sm text-charcoal-500 dark:text-charcoal-400 leading-relaxed">
          Grab a special <span class="font-bold text-corn-500">10% OFF</span> discount for your first premium guilt-free popcorn purchase!
        </p>
      </div>

      <!-- Coupon Code Container with dash borders -->
      <div class="py-4 px-6 bg-charcoal-50 dark:bg-charcoal-900 border-2 border-dashed border-corn-300 rounded-xl relative group overflow-hidden">
        <div class="text-xs uppercase tracking-widest text-charcoal-400 dark:text-charcoal-500 font-extrabold mb-1">Your coupon code</div>
        <div class="text-2xl font-display font-extrabold tracking-widest text-corn-500 select-all">
          FITCORN10
        </div>
      </div>

      <!-- Action CTAs -->
      <div class="space-y-3">
        <a routerLink="/produk" 
           (click)="closePopup()"
           class="block w-full py-4 bg-corn-400 hover:bg-corn-500 text-charcoal-900 font-sans font-bold text-xs tracking-wider uppercase rounded-full shadow-sm hover:shadow transition-all duration-300 transform hover:-translate-y-0.5">
          Shop Now with 10% Off
        </a>
        <button (click)="closePopup()" 
                class="block w-full py-2.5 text-xs font-semibold text-charcoal-400 hover:text-charcoal-600 dark:hover:text-white transition-colors cursor-pointer">
          No thanks, I prefer regular popcorn
        </button>
      </div>

    </div>

  </div>

</div>
